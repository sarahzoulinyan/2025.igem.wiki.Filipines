<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="https://static.igem.wiki/common/icons/favicons/igem-2022.svg" />
    <link rel="license" href="https://creativecommons.org/licenses/by/4.0/" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Gugi&display=swap" rel="stylesheet">


    <!-- Bootstrap CSS (v5) -->
    <link href="{{ url_for('static', filename='bootstrap.min.css') }}" rel="stylesheet" />
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />


   <!-- GSAP - Try jsDelivr CDN -->
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>


    <title>{% block title %}{% endblock %} | Project - iGEM 2025</title>
  </head>


  <body class="{% block body_class %}{% endblock %}">
    <!-- Navigation -->
    {% include 'menu.html' %}


    <!-- Header -->
    <header class="{% block header_class %}default-hero py-5 mb-5{% endblock %}">
      <div class="container h-100">
        <div class="row h-100 align-items-center">
          <div class="col-lg-12">
            <div class="d-flex align-items-center">
              <h1 class="hero-typing display-4 mt-5 mb-2">{{ self.title() }}</h1>
            </div>
            <p class="lead mb-5">{% block lead %}{% endblock %}</p>
          </div>
        </div>
      </div>
    </header>


    <!-- Star Navigation System -->
    <div id="star-nav" class="star-nav">
      <div class="star-rail" id="star-rail">
        <div id="star-nav-heading" class="star-nav-heading">Jump to...</div>
        <div id="star-header-display" class="star-header-display"></div>
        <!-- Stars will be populated by JavaScript -->
      </div>
    </div>

    <main id="main" class="{% block main_class %}page-narrow{% endblock %}">
  {% block page_content %}{% endblock %}
</main>
    <!-- Floating UI (kept outside the normal flow) -->
    <div class="rocket-container" aria-hidden="true">
      <img src="https://static.igem.wiki/teams/5717/main/rocketship.webp" class="rocket" alt="Rocket" />
      <div class="flame"></div>
    </div>
    <div class="rocket-track" aria-hidden="true"></div>


    <script>
document.addEventListener('DOMContentLoaded', () => {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in-view');
        io.unobserve(e.target); // animate once
      }
    });
  }, { threshold: 0.2 });


  document.querySelectorAll('.span').forEach(el => io.observe(el));
});
</script>




    <!-- Footer -->
    <div class="{% block footer_class %}page-full{% endblock %}">
      {% include 'footer.html' %}
    </div>


    <!-- JS (load once, at the end) -->
    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>


    {% block scripts %}{% endblock %}
   
    <style>
      .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, #641C33 0%, #24041C 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }
        /* Stars background animation */
        .loading-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #E2E0DE, transparent),
                radial-gradient(2px 2px at 40px 70px, #D47484, transparent),
                radial-gradient(1px 1px at 50px 50px, #E2E0DE, transparent),
                radial-gradient(1px 1px at 80px 10px, #E86B55, transparent),
                radial-gradient(2px 2px at 130px 80px, #E2E0DE, transparent),
                radial-gradient(1px 1px at 110px 120px, #D47484, transparent);
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            animation: stars 120s linear infinite;
        }


        @keyframes stars {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-200px);
            }
        }


        .loading-overlay.loaded {
            opacity: 0;
            visibility: hidden;
        }


        .loader {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(228, 107, 85, 0.2);
            border-top-color: #E86B55;
            border-right-color: #D47484;
            border-radius: 50%;
            animation: marsRotate 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 0 40px rgba(232, 107, 85, 0.5);
        }


        .loader::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #E86B55, #641C33);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(232, 107, 85, 0.8);
        }


        @keyframes marsRotate {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.1);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }


        .loading-text {
            font-size: 1.1rem;
            color: #E2E0DE;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(226, 224, 222, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }


        @keyframes pulse {
            0%, 100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }


        .progress-bar {
            width: 250px;
            height: 6px;
            background: rgba(100, 28, 51, 0.5);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(212, 116, 132, 0.3);
        }


        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #E86B55, #D47484, #E86B55);
            background-size: 200% 100%;
            width: 0%;
            transition: width 0.3s ease;
            animation: shimmer 2s linear infinite;
            box-shadow: 0 0 10px rgba(232, 107, 85, 0.7);
        }


        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }
    </style>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
        <div class="loading-text">Mission to Mars...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>
    </div>
    <script>
      // Loading screen functionality
      (function() {
          const overlay = document.getElementById('loadingOverlay');
          const progressBar = document.getElementById('progressBar');
         
          let progress = 0;
          const progressInterval = setInterval(() => {
              progress += Math.random() * 15;
              if (progress > 90) progress = 90; // Cap at 90% until page loads
              progressBar.style.width = progress + '%';
          }, 200);
         
          // When page is fully loaded
          window.addEventListener('load', () => {
              // Complete the progress bar
              clearInterval(progressInterval);
              progressBar.style.width = '100%';
             
              // Wait a moment, then fade out
              setTimeout(() => {
                  overlay.classList.add('loaded');
                 
                  // Remove from DOM after fade completes
                  setTimeout(() => {
                      overlay.remove();
                  }, 500); // Match the CSS transition duration
              }, 300);
          });
      })();
    </script>


  </body>
</html>
